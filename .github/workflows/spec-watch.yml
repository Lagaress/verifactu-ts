name: Vigilancia de la especificación AEAT

on:
  schedule:
    - cron: '17 6 * * 1' # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: check
        run: |
          set +e
          node --experimental-strip-types --no-warnings scripts/fetch-spec.ts --check > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "La AEAT ha modificado material técnico de VERI*FACTU ($(date -u +%F))" \
            --label spec-change \
            --body-file report.txt || gh issue create \
            --title "La AEAT ha modificado material técnico de VERI*FACTU ($(date -u +%F))" \
            --body-file report.txt
